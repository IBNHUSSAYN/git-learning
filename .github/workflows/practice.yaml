name: GITHUB ACTION
on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  docker:
    name: Base_image
    runs-on: ubuntu-22.04 
    environment:
      JOBS-ENVIRONMENT
      variable
    steps:
      - name: step_one
        run: |
          echo "Good Morning"
          echo "Hi! DevOps Engineer"
          echo "Username: ${{ vars.USERNAME }}"
          echo "Password: ${{ secrets.PASSWORD }}"
          echo "The app ${{ vars.APP_NAME }}, with Version ${{ vars.APP_VERSION}} has the API-KEYS of ${{ secrets.API_KEYS }}"
          echo -e "APP-NAME: ${{ vars.APP_NAME }} \nPASSWORD: ${{ secrets.API_KEYS }}"
          
       
      
         
