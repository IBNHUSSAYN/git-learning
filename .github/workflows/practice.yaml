name: GITHUB ACTION
on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  docker:
    name: Base_image
    runs-on: ubuntu-22.04      
    steps:
      - name: step_one
        env:
          NAME: "Hussaini Yusuf"
          USERNAME: ${{ vars.USERNAME }}
          DB_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          echo "Good Morning"
          echo "Hi! DevOps Engineer"
          echo "Hi! ${{ env.NAME}} "
          echo "Username: ${{ vars.USERNAME }}"
          echo "Password: ${{ secrets.PASSWORD }}"
          echo "The app ${{ vars.APP_NAME }} has the API-KEYS of ${{ secrets.API_KEYS }}"
          echo -e "USERNAME: $USERNAME \nPASSWORD: $DB_PASSWORD"
          
       
      
         
