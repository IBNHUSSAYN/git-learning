name: GITHUB ACTION
on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  docker:
    name: Base_image
    runs-on: ubuntu-22.04      
    steps:
      - name: step_one
        env:
          NAME: "Hussaini Yusuf"
          APP_NAME: ${{ vars.APP_NAME }}
          VERSION: ${{ vars.VERSION }}
          API_KEYS: ${{ secrets.API_KEYS }}
        run: |
          echo "Good Morning"
          echo "Hi! DevOps Engineer"
          echo "Hi! ${{ env.NAME}} "
          echo "Username: ${{ vars.USERNAME }}"
          echo "Password: ${{ secrets.PASSWORD }}"
          echo "The app ${{ vars.APP_NAME }}, with Version $VERSION has the API-KEYS of ${{ secrets.API_KEYS }}"
          echo -e "APP-NAME: $APP_NAME \nPASSWORD: $API_KEYS"
          
       
      
         
