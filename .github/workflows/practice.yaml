name: GITHUB ACTION
on:
  pull_request:
    branches:
      - main
      - dev
jobs:
  docker:
    name: Base_image
    runs-on: ubuntu-22.04
    steps:
      - name: step_one
        run: |
          echo "Good Morning"
          echo "Hi! DevOps Engineer"
          echo "Hi! ${{ env.NAME}} "
          echo "Username: ${{ vars.USERNAME }}"
          echo "Password: ${{ secrets.PASSWORD }}"
        env:
          NAME: "Hussaini Yusuf"
